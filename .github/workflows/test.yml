name: Toolkit unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      # Integration deliberately requires an explicitly verified runtime snapshot.
      # Do not replace it with a floating download of main/latest.
