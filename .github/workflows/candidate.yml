name: Author toolkit candidate
on:
  push:
    branches: [release/next]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: source
        name: Read the reviewed runtime pin
        run: |
          node - <<'JS'
          const fs=require('fs'),pin=require('./runtime.lock.json').candidateSource;
          if(!pin||pin.repository!=='Razdva122/clean-your-tv-lg-webos'||!/^[a-f0-9]{40}$/.test(pin.commit))throw Error('An exact reviewed main-project commit is required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+pin.commit+'\n');
          JS
      - uses: actions/checkout@v4
        with:
          repository: Razdva122/clean-your-tv-lg-webos
          ref: ${{ steps.source.outputs.commit }}
          path: .candidate-source
      - name: Install trusted build dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix .candidate-source
      - name: Export the pinned candidate runtime
        working-directory: .candidate-source
        run: python scripts/export-theme-runtime.py --out ../.runtime/candidate
      - name: Install browser for integration checks
        run: npx playwright install --with-deps chromium
      - name: Test the paired author toolkit and runtime
        run: |
          export CYTV_THEME_RUNTIME="$PWD/.runtime/candidate"
          export CYTV_THEME_BROWSER="$(node -p 'require("playwright").chromium.executablePath()')"
          npm test
      - name: Build the unpublished candidate bundle
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path
          root=Path.cwd();target=root/'dist';target.mkdir()
          (root/'toolkit-source.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()})+'\n')
          paths=['bin','lib','examples','docs','package.json','package-lock.json','runtime.lock.json','README.md','CONTRIBUTING.md','LICENSE','toolkit-source.json','.runtime/candidate']
          for name in paths:
              if not (root/name).exists():raise ValueError('Missing candidate input: '+name)
          archive=target/'clean-your-tv-lg-theme-candidate.tar.gz'
          with tarfile.open(archive,'w:gz') as out:
              for name in paths:out.add(root/name,arcname='clean-your-tv-lg-theme/'+name)
          pin=json.loads((root/'runtime.lock.json').read_text())['candidateSource']
          evidence={'schemaVersion':1,'toolkitCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'runtimeSource':pin,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'archive':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'publishedApplicationRelease':False}
          (target/'candidate-provenance.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: theme-toolkit-candidate
          path: dist/*
          if-no-files-found: error
